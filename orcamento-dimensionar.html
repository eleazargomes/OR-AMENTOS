<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dimensionar Orçamento</title><link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script><script src="js/app.js"></script></head><body><main><div class="ph"><h1 id="h">Dimensionar Orçamento</h1><a href="orcamentos.html">&larr; Voltar para a lista</a></div>
<div class="card info" id="inf"></div>
<div class="card"><h2>Adicionar item cadastrado</h2><div class="grid">
<div><label>Material / Hora</label><select id="c"></select></div><div><label>Qtd / Horas</label><input id="q" type="number" min="0.01" step="0.01" value="1"></div>
<button class="btn az" onclick="addC()">+ Adicionar</button></div></div>
<div class="card"><h2>Adicionar item avulso (sem cadastro)</h2><div class="grid">
<div><label>Descrição</label><input id="ad" placeholder="Ex: Coxim do motor (importado)"></div><div><label>Qtd</label><input id="aq" type="number" min="1" value="1"></div>
<button class="btn" onclick="addA()">+ Item sem cadastro</button></div><p class="muted" style="margin-top:.8rem">Itens sem cadastro seguem para cotação do setor de Suprimentos.</p></div>
<div class="tc"><table><thead><tr><th>Item</th><th>Origem</th><th>Qtd</th><th>Unit.</th><th>Subtotal</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="total">Total já precificado: <b id="tt">R$ 0,00</b></div>
<div class="acts"><a class="btn cz" href="orcamentos.html">Cancelar</a><button class="btn vd" onclick="save()">Salvar Dimensionamento</button></div></main>
<script>
let I=[],M=[];
function draw(){let t=0;tb.innerHTML=I.map((x,i)=>{const ok=x.cotado,s=ok?x.qtd*x.unitario:0;t+=s;return `<tr><td>${esc(x.descricao)}</td>
<td>${x.origem==='Cadastrado'?'<span class="badge b-info">Cadastrado</span>':'<span class="badge b-pendente">Sem Cadastro</span>'}</td><td>${x.qtd}</td>
<td>${ok?brl(x.unitario):'<span class="muted">aguardando cotação</span>'}</td><td>${ok?brl(s):'-'}</td><td><button class="btn sm vm" onclick="I.splice(${i},1);draw()">X</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Nenhum item.</td></tr>';tt.textContent=brl(t)}
function addC(){const m=M[c.value];if(!m||!(+q.value>0))return;I.push({origem:'Cadastrado',descricao:m.nome+' ('+m.unidade+')',qtd:+q.value,unitario:m.valor,cotado:true});draw()}
function addA(){if(!ad.value.trim()||!(+aq.value>0))return alert('Informe descrição e quantidade.');I.push({origem:'Sem cadastro',descricao:ad.value.trim(),qtd:+aq.value,unitario:0,cotado:false});ad.value='';draw()}
const save=()=>run(async()=>{await api('salvarItens',{id:qs('id'),itens:I});alert('Salvo!');location.href='orcamentos.html'});
run(async()=>{if(!init('dimensionar'))return;const id=qs('id');if(!id){alert('Selecione um orçamento na lista.');location.href='orcamentos.html';return}
M=await api('listarMateriais');c.innerHTML=M.map((m,i)=>`<option value="${i}">[${esc(m.tipo)}] ${esc(m.nome)} - ${brl(m.valor)}</option>`).join('');
const r=await api('getOrcamento',{id});h.textContent='Dimensionar #'+r.orcamento.id;
inf.innerHTML=[['Veículo',r.orcamento.veiculo],['Setor',r.orcamento.setor],['Avaria',r.orcamento.descricao]].map(x=>`<div><small>${x[0]}</small>${esc(x[1])}</div>`).join('');
I=r.itens;draw()})
</script></body></html>
