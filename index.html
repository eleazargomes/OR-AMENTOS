<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Início</title>
<link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script><script src="js/app.js"></script></head>
<body><main><div class="ph"><h1>Painel</h1></div><p class="sub" id="hi"></p>
<div class="grid" id="st"></div><h2 style="margin:1.5rem 0 1rem;color:#2c3e50">Atalhos</h2><div class="grid" id="at"></div></main>
<script>run(async()=>{if(!init())return;const u=sess();hi.textContent='Olá, '+u.nome+'! Setor: '+(u.setor||'-');
at.innerHTML=Object.keys(PAGES).filter(can).map(k=>`<a class="btn az" href="${PAGES[k][0]}">${PAGES[k][1]}</a>`).join('');
if(!can('orcamentos'))return;const l=await api('listarOrcamentos');
const c=s=>l.filter(o=>o.status===s).length;
st.innerHTML=[['Total',l.length],['Pendentes',c('Pendente')],['Aprovados',c('Aprovado')],['Rejeitados',c('Rejeitado')],['Aguardando cotação',l.filter(o=>o.pend>0).length]]
.map(x=>`<div class="card stat"><small class="muted">${x[0]}</small><b>${x[1]}</b></div>`).join('')})</script></body></html>
