<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materiais e Horas</title>
<link rel="stylesheet" href="css/style.css"><script src="js/config.js"></script><script src="js/app.js"></script></head>
<body><main><div class="ph"><h1>Tabela de Materiais & Horas</h1></div>
<p class="sub">Defina valores de materiais por fracionamento e custos de hora técnica interna e externa.</p>
<form class="card" id="f"><h2>Pré-definir Item</h2><div class="grid">
<div><label>Tipo</label><select id="t" required><option>Material</option><option>Hora Interna</option><option>Hora Externa</option></select></div>
<div><label>Nome / Especialidade</label><input id="n" required placeholder="Ex: Óleo 15W40 / Mecânico Chefe"></div>
<div><label>Fracionamento</label><select id="u"><option>Litro (L)</option><option>Mililitro (ml)</option><option>Metro (m)</option><option>Quilo (kg)</option><option>Unidade (un)</option><option>Caixa (cx)</option></select></div>
<div><label>Valor (R$)</label><input id="v" type="number" step="0.01" min="0" required placeholder="0,00"></div>
<button class="btn">+ Cadastrar</button></div></form>
<div class="tc"><table><thead><tr><th>Tipo</th><th>Nome</th><th>Fracionamento</th><th>Valor</th><th>Ação</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script>
t.onchange=()=>{u.disabled=t.value!=='Material'};
async function load(){const l=await api('listarMateriais');tb.innerHTML=l.map(m=>`<tr><td><span class="badge ${m.tipo==='Material'?'b-pendente':'b-info'}">${esc(m.tipo)}</span></td><td>${esc(m.nome)}</td><td>${esc(m.unidade)}</td><td>${brl(m.valor)}</td>
<td><button class="btn sm vm" onclick="del('${m.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nada cadastrado.</td></tr>'}
const del=id=>confirm('Excluir?')&&run(async()=>{await api('excluirMaterial',{id});await load()});
f.onsubmit=e=>{e.preventDefault();run(async()=>{await api('salvarMaterial',{tipo:t.value,nome:n.value,unidade:t.value==='Material'?u.value:'hora',valor:+v.value});f.reset();await load()})};
run(async()=>{if(!init('materiais'))return;await load()});
</script></body></html>
